/* V7 — miniature skill icons, feedback and animated ball. Layout remains 1/3 XI + 2/3 draft. */

.role-icon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:17px;height:17px;border-radius:6px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 13%,transparent);vertical-align:middle;color:var(--batter)}
.role-icon svg{display:block;width:13px;height:13px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
.role-icon.role-bowler{color:var(--bowler)}.role-icon.role-keeper{color:var(--keeper)}.role-icon.role-allrounder{color:var(--allround)}
.role-icon.small{width:13px;height:13px;border-radius:4px}.role-icon.small svg{width:10px;height:10px;stroke-width:2}
.tiny-name{display:flex!important;gap:5px;align-items:center;min-width:0}
.tiny-name .name-text{min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.tiny-card-head .skill-kicker{font-size:9px;font-weight:950;letter-spacing:.25px;color:var(--batter);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tiny-card-head .skill-kicker.role-bowler{color:var(--bowler)}.tiny-card-head .skill-kicker.role-keeper{color:var(--keeper)}.tiny-card-head .skill-kicker.role-allrounder{color:var(--allround)}
.xi-mini .xi-role{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.xi-mini.xi-filled{background:linear-gradient(135deg,#2f2357,#231945);box-shadow:inset 0 0 18px #f855c208}
.xi-mini.just-drafted{animation:slot-arrive .75s ease-out}
.tiny-player{transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease}
.tiny-player:focus-within,.tiny-player:hover{border-color:#f855c2;box-shadow:0 0 0 1px #f855c222,0 5px 18px #0003;transform:translateY(-1px)}
.tiny-player:active{transform:scale(.985)}
.compact-spin{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 25% 20%,#fa85d3,#f855c2 68%,#f745bc);box-shadow:inset 0 -3px 0 #662fb2,0 2px 15px #f855c215;transition:filter .15s,transform .15s}
.compact-spin:hover:enabled{filter:brightness(1.07)}.compact-spin:active:enabled{transform:scale(.97)}
.compact-spin::after{content:'';position:absolute;inset:-30%;background:linear-gradient(110deg,transparent 35%,#fff8 50%,transparent 65%);transform:translateX(-120%) rotate(15deg);pointer-events:none}
.compact-spin:hover:enabled::after{animation:button-shimmer 1.25s ease}

const chosenIds=()=>new Set(state.slots.filter(Boolean).map(p=>p.id));
function poolFor(country,era){
 const ids=ERA_ROSTERS[country]?.[String(era)]||[];const used=chosenIds();
 const order=(state.draw?.country===country&&state.draw?.era===era&&Array.isArray(state.draw.order))?state.draw.order:ids;
 return order.map(id=>BY_ID[id]).filter(p=>p&&!used.has(p.id));
}
function validDraws(){const found=[];for(const [country,eras] of Object.entries(ERA_ROSTERS))for(const era of Object.keys(eras).map(Number))if(poolFor(country,era).length)found.push({country,era});return found;}
function draw(which='both'){
 const all=validDraws();let choices=all;
 if(which==='country')choices=all.filter(x=>state.draw&&x.era===state.draw.era&&x.country!==state.draw.country);
 if(which==='era')choices=all.filter(x=>state.draw&&x.country===state.draw.country&&x.era!==state.draw.era);
 if(!choices.length){showMessage('No other available era squad for this reroll.');return;}
 const x=choices[rnd(0,choices.length-1)],order=[...ERA_ROSTERS[x.country][String(x.era)]];
 for(let i=order.length-1;i>0;i--){const j=rnd(0,i);[order[i],order[j]]=[order[j],order[i]];}
 state.draw={...x,order};state.page=0;
 if(which!=='both')state.rerolls[which]--;

}

function recordMetrics(p){
 // Real career records if present; neutral gameplay baselines where source figures are unavailable.
 const baseBat={O:72,B:70,W:63,A:61,P:42,S:40}[p.role]||55;
 const baseBowl={O:23,B:23,W:23,A:62,P:73,S:73}[p.role]||40;
 let bat=p.avg!=null?clamp(22+p.avg*1.24,38,100):p.sr!=null?clamp(54+(p.sr-100)*.44,40,98):baseBat;
 let bowl=p.ba!=null?clamp(122-p.ba*1.35,38,98):baseBowl;
 return {bat:Math.round(clamp(bat,35,100)),bowl:Math.round(clamp(bowl,18,100))};
}
function buildPower(){
 const players=state.slots.filter(Boolean),q=players.map(recordMetrics);
 if(!q.length)return {bat:0,bowl:0,balance:0,power:0};
 const avg=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
 // Batting order is the user's sequence, with greater weight to the top order.
 const bat=avg(q.map((x,i)=>x.bat*(i<2?1.12:i<6?1:i<8?.86:.72)));
 // Any bowling combination is legal; no required spinner/pace slots.
 const bowlers=players.map((p,i)=>({p,skill:q[i].bowl})).sort((a,b)=>b.skill-a.skill).slice(0,5);
 const bowl=avg(bowlers.map(x=>x.skill));
 const specialists=players.filter(p=>['P','S','A'].includes(p.role)).length;
 const balance=clamp(Math.round(50+Math.min(5,specialists)*8+(players.some(p=>p.role==='W')?10:0)),40,100);
 const power=Math.round(clamp(bat*.51+bowl*.40+balance*.09,25,100));
 return {bat:Math.round(bat),bowl:Math.round(bowl),balance,power};
}

function simOne(redraw=true){if(state.results.length>=20)return;const ix=state.results.length,[nation,oppP]=OPP[ix%10];const power=buildPower().power;const away=ix>=10;const chance=clamp(.72+(power-oppP-(away?2:0))*.027,.16,.96);const win=Math.random()<chance;
 const base=rnd(142,197)+Math.round((power-80)*1.5);let us=clamp(base+rnd(-20,20),94,254),them=clamp(rnd(140,194)+Math.round((oppP-80)*1.6)+rnd(-19,19),92,253);

function musicNoiseBuffer(ac){
 if(drumNoise&&drumNoise.sampleRate===ac.sampleRate)return drumNoise;

function musicVoice(hz,at,length,shape='triangle',level=.027,filterHz=0){
 if(!audioCtx||!hz)return;
 const a=audioCtx,osc=a.createOscillator(),g=a.createGain();

 if(filterHz){const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=filterHz;osc.connect(lp);lp.connect(g);}

function drumHit(kind,at,soft=false){
 if(!audioCtx)return;

 if(kind==='kick'){

function playMusicNote(at){

function crowdReaction(tier='match'){

  const seconds=tier==='major'?2.0:tier==='win'?1.35:.78;
  const frameCount=Math.max(1,Math.round(ac.sampleRate*seconds));
  const buffer=ac.createBuffer(1,frameCount,ac.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<frameCount;i++)data[i]=(Math.random()*2-1)*(.6+.4*Math.sin(i*.009));

  gain.gain.setValueAtTime(peak*.8,at+Math.max(.22,seconds-.4));
  gain.gain.exponentialRampToValueAtTime(.0001,at+seconds-.035);

  source.start(at);source.stop(at+seconds);

  }
}

/* V6 — probabilistic match forecasting, player record enrichment, and hosted multiplayer. */
const forecastCache = new Map();
function estimateFixture(ix,trials=120){
  const ours=state.slots.filter(Boolean);if(ours.length!==11||ix>=20)return {prob:50,ci:0,n:0};
  const [country]=OPP[ix%10], rival=oppositionXI(country),usFirst=ix%2===0;
  const key=ix+'|'+ours.map(p=>p.id).join(',')+'|'+ours.map(p=>`${p.runs||0}:${p.wk||0}`).join(',');
  if(forecastCache.has(key))return forecastCache.get(key);
  let wins=0,ties=0;for(let i=0;i<trials;i++){
    const first=buildInnings(usFirst?ours:rival,usFirst?rival:ours);
    const second=buildInnings(usFirst?rival:ours,usFirst?ours:rival,first.total+1);
    const ourRuns=usFirst?first.total:second.total,oppRuns=usFirst?second.total:first.total;
    if(ourRuns>oppRuns)wins++;else if(ourRuns===oppRuns)ties++;
  }
  // Add-one smoothing prevents overconfident 0% or 100% probabilities on small samples.
  const p=(wins+.5*ties+1)/(trials+2),ci=1.96*Math.sqrt(p*(1-p)/(trials+2));
  const out={prob:Math.round(100*p),ci:Math.round(ci*100),n:trials};forecastCache.set(key,out);
  if(forecastCache.size>100)forecastCache.delete(forecastCache.keys().next().value);
  return out;
}

// Supplement embedded, sourced career records with Wikipedia cricket infobox records. Wikipedia
// is a secondary source (not ICC-certified); the figures are always format-labelled and linked.
const wikiStatCache=(()=>{try{return JSON.parse(localStorage.getItem('cricket_legends_wiki_v6')||'{}');}catch{return {};}})();
const wikiPending=new Set();
function plainWiki(s){return String(s||'').replace(/<!--[^]*?-->/g,'').replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'$2').replace(/\[\[([^\]]+)\]\]/g,'$1').replace(/\{\{[^\n]*?\}\}/g,'').replace(/<[^>]+>/g,'').replace(/''+/g,'').replace(/&nbsp;/gi,' ').trim();}
function wikiField(w,field){const escaped=field.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp('^\\|\\s*'+escaped+'\\s*=\\s*(.*)$','im');return plainWiki((w.match(re)||[])[1]||'');}
function numericWiki(s){const v=plainWiki(s).replace(/,/g,'').replace(/[†*‡]/g,'').trim();return /^\d+(?:\.\d+)?$/.test(v)?Number(v):null;}
function processWikiStats(w){let found=[];for(let i=1;i<=4;i++){
  const label=wikiField(w,'column'+i);let format=/T20I|Twenty20 International/i.test(label)?'T20I':/ODI|One Day International/i.test(label)?'ODI':/Test/i.test(label)?'Test':null;
  if(!format)continue;
  const m=numericWiki(wikiField(w,'matches'+i)),runs=numericWiki(wikiField(w,'runs'+i)),avg=numericWiki(wikiField(w,'bat avg'+i));
  const wk=numericWiki(wikiField(w,'wickets'+i)),ba=numericWiki(wikiField(w,'bowl avg'+i));
  if(m==null)continue;
  found.push({fmt:format,m,runs,avg,wk,ba});
 }
 if(!found.length)return null;
 // Modern players: prefer international T20 figures with 10+ appearances; otherwise ODIs or Tests.
 found.sort((a,b)=>(b.fmt==='T20I'&&b.m>=10?4:b.fmt==='ODI'?3:b.fmt==='Test'?2:1)-(a.fmt==='T20I'&&a.m>=10?4:a.fmt==='ODI'?3:a.fmt==='Test'?2:1));
 return found[0];
}
for(const [id,record] of Object.entries(wikiStatCache)){
 const p=BY_ID[id];if(p&&record&&record.m!=null){Object.assign(p,record);}
}
async function fetchWikiRecord(p){
 if(!p||p.m!=null||wikiPending.has(p.id)||wikiStatCache[p.id])return;
 wikiPending.add(p.id);
 try{
  const pageTitle=p.name.replace(/\s+/g,'_');
  const url='https://en.wikipedia.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main&format=json&formatversion=2&origin=*&titles='+encodeURIComponent(pageTitle);
  const res=await fetch(url,{signal:AbortSignal.timeout?AbortSignal.timeout(8500):undefined});if(!res.ok)throw new Error('Records source unavailable');
  const data=await res.json();const page=data.query?.pages?.[0];
  const w=page?.revisions?.[0]?.slots?.main?.content||page?.revisions?.[0]?.slots?.main?.['*'];
  if(!w||!(/infobox\s+cricketer/i.test(w)))throw new Error('No cricket infobox');
  const st=processWikiStats(w);if(!st)return;
  const record={...st,source:'https://en.wikipedia.org/wiki/'+encodeURIComponent(page.title.replace(/ /g,'_'))};
  Object.assign(p,record);wikiStatCache[p.id]=record;
  try{localStorage.setItem('cricket_legends_wiki_v6',JSON.stringify(wikiStatCache));}catch{}
  if(state.screen==='draft'||state.screen==='ready')render();
 }catch(e){}finally{wikiPending.delete(p.id);}
}

async function enrichDraw(){

 const candidates=poolFor(d.country,d.era).filter(p=>p.m==null).slice(0,20);

 let next=0;await Promise.all(Array.from({length:Math.min(3,candidates.length)},async()=>{
  while(next<candidates.length&&gen===enrichGeneration){const p=candidates[next++];await fetchWikiRecord(p);}
 }));
}

// First paint occurs after all enhanced controls are initialised.

function poolFor(country,era){
 const ids=ERA_ROSTERS[country]?.[String(era)]||[];const used=chosenIds();
 const order=(state.draw?.country===country&&state.draw?.era===era&&Array.isArray(state.draw.order))?state.draw.order:ids;
 return order.map(id=>BY_ID[id]).filter(p=>p&&!used.has(p.id));
}

function validDraws(){const found=[];for(const [country,eras] of Object.entries(ERA_ROSTERS))for(const era of Object.keys(eras).map(Number))if(poolFor(country,era).length)found.push({country,era});return found;}

function draft(){
 let c=state.draw?poolFor(state.draw.country,state.draw.era):[];let n=Math.max(1,Math.ceil(c.length/6));state.page=clamp(state.page,0,n-1);
 return `<div class="draft-board">${xiBoard()}<section class="options-zone" aria-label="Randomized era-specific players">${compactDraw()}<div class="options-heading"><div><strong>20-PLAYER ERA POOL</strong><span>${state.draw?html(state.draw.country)+' · '+state.draw.era+'s · era only':'Spin to draw a country and decade'}</span></div><div class="options-count">${state.draw?c.length+' OF 20 LEFT':(11-state.round)+' TO DRAFT'}</div></div>${state.draw?`<div class="tiny-grid">${c.slice(state.page*6,state.page*6+6).map(tinyPlayer).join('')}${Array.from({length:Math.max(0,6-c.slice(state.page*6,state.page*6+6).length)},()=>'<div class="tiny-placeholder"><span>🏏</span><small>NO MORE<br>ON THIS PAGE</small></div>').join('')}</div><div class="tiny-pager"><button data-action="page" data-offset="-1" ${!state.page?'disabled':''}>‹ PREV</button><span>PAGE ${state.page+1} / ${n} · ERA-SPECIFIC</span><button data-action="page" data-offset="1" ${state.page===n-1?'disabled':''}>NEXT ›</button></div>`:`<div class="waiting-draw"><div class="waiting-logo">🏏</div><strong>WHO'S NEXT?</strong><p>Spin a nation and decade to see 20 players from that era. Choose any position in your batting order.</p><button class="btn main" data-action="spin">🎲 SPIN FOR PLAYERS</button></div>`}</section></div>`;
}

function showGuide(){openModal(`<div class="modal-head"><div><div class="sup">CRICKET LEGENDS V9</div><h2>How to play</h2></div><button class="icon-btn" data-action="close">✕</button></div><div class="guide scrollbox"><p>Spin a country and decade. You get exactly 20 international players selected for that decade, selected as a mixed-role shortlist emphasizing players with sustained appearances during that period. No players from other eras are inserted as wildcard choices.</p><p>Every player displays a skill icon: bat for batsman, cricket ball for bowler, lightning for all-rounder and gloves for wicketkeeper. Spin using the red cricket ball; the ball animation can be reduced through system motion settings. Optional achievements celebrate notable choices, varied squads and win streaks. Animated floodlights illuminate the stadium; each finished match features a short crowd response, while actual simulated centuries and five-wicket hauls trigger major celebrations. You can reduce animations in your system accessibility settings, and mute crowd sounds using the SFX button. Tap a player and choose any empty batting position from #1–11. Tap a filled position in the XI at any time to move or swap its occupant. There is no compulsory spinner, fast-bowler, wicketkeeper or all-rounder slot: you choose your eleven and batting order.</p><p>Player career figures (Tests, ODIs or T20Is) are sourced where available and not guessed. Older era players without embedded numeric records are fetched from Wikipedia career infoboxes when an internet connection permits it; those additional published figures are format-labelled and linked. If retrieval fails, figures stay unavailable rather than invented. Era shortlists are curated, not audited statistical top-11 rankings by exact decade appearances.</p><p>Winning percentages use repeated ball-by-ball Monte Carlo trials inspired by Perera (2015), including batsman–bowler differences, wickets, over and chase pressure. These are a simplified model, not the thesis’s fitted probability estimates or a scientifically validated predictor. Your batting order is yours, and the five strongest available bowling options bowl the innings. A team with four fast bowlers and no spinner is allowed. Matches include full scorecards, leading run scorers, wicket takers and a local best-attempt leaderboard.</p><p>The full set of 20 matches can be simulated in one action; every scorecard is retained. Online matches and server-verified global rankings require the bundled Node server to be hosted and reached by both players. Audio is original in-app sound/music, enabled after the first tap. Match-end advertising screens are demo placeholders, not paid ads. Actual ads require ad-network integration in a hosted app.</p></div><button class="btn main full" data-action="close">GOT IT</button>`);}

/* V7 : clearer role identity, cricket-ball spin and transparent achievements. */
let lastDrafted=null,spinBusy=false,toastTimeout=null;
const SKILL_NAMES={O:'BATSMAN',B:'BATSMAN',P:'BOWLER',S:'BOWLER',A:'ALL-ROUNDER',W:'WICKETKEEPER'};
const SKILL_KIND={O:'batter',B:'batter',P:'bowler',S:'bowler',A:'allrounder',W:'keeper'};
const ACHKEY='cricket_legends_v7_achievements';
let achievements={};try{achievements=JSON.parse(localStorage.getItem(ACHKEY)||'{}')||{}}catch{}
function skillName(role){return SKILL_NAMES[role]||'CRICKETER'}
function roleIcon(role,compact=false){
 const k=SKILL_KIND[role]||'batter';
 const paths={
  batter:'<path d="M7.3 4.1 17.9 14.7l-2.6 2.6L4.7 6.7Q4 6 4.7 5.3l1.8-1.2q.5-.4.8 0Z"/><path d="m15.3 17.3 3.6 3.6M14.1 19.2l3.2-3.2"/>',
  bowler:'<circle cx="12" cy="12" r="8.6"/><path d="M7.5 4.7c5.1 3.5 6.9 11.1 3.4 15M13.3 3.7c-1.3 5.2 1 11.4 5.7 14.4"/>',
  allrounder:'<path d="M4 4.5 13.7 14l-2.2 2.2L2.4 6.9Z"/><path d="m11.5 16.2 3.1 3.1"/><circle cx="17.9" cy="7.6" r="4.2"/><path d="M16 4c2.2 2.1 3.2 4.6 2.7 7.8"/>',
  keeper:'<path d="M3.4 14.4V9.2c0-1.6 2-1.7 2.4-.2V5.5c0-1.5 2.3-1.6 2.4 0v3-5.1c0-1.6 2.5-1.5 2.5.1V8V5c0-1.5 2.3-1.5 2.3.2v5.3l.9-1.1c1.5-1.5 3.3-.1 2.2 1.5l-2.2 3.3-.4 4.2H6.2l-2.8-4Z"/><path d="M17.4 9.1 20 11l.8 6.7H16"/>'
 };
 return `<span class="role-icon role-${k}${compact?' small':''}" title="${skillName(role)}" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false">${paths[k]}</svg></span>`;
}
const cricketBallSVG='<span class="cricket-ball" aria-hidden="true"><svg viewBox="0 0 44 44" focusable="false"><defs><radialGradient id="ballGlow" cx="29%" cy="22%" r="85%"><stop offset="0" stop-color="#ff8884"/><stop offset=".48" stop-color="#cf3139"/><stop offset="1" stop-color="#7f1424"/></radialGradient></defs><circle cx="22" cy="22" r="19" fill="url(#ballGlow)" stroke="#611220" stroke-width="1.3"/><path d="M14 5c17 9 20 25 14 34M9 8c17 8 20 21 17 33" stroke="#ffe3cb" stroke-width="1.9" fill="none"/><path d="m13 9-3 3m6 0-3 3m7 0-4 3m8 0-4 3m8 0-4 3m7 0-4 3" stroke="#ffe4cf" stroke-width="1.3"/><ellipse cx="14" cy="11" rx="7" ry="4" fill="#fff" opacity=".15" transform="rotate(-28 14 11)"/></svg></span>';
function tinyPlayer(p){return `<article class="tiny-player"><button class="tiny-pick" data-action="choose" data-id="${html(p.id)}" aria-label="Select ${html(p.name)}, ${skillName(p.role)}"><div class="tiny-card-head"><span class="skill-kicker role-${SKILL_KIND[p.role]}">${skillName(p.role)}${p.role==='P'?' · PACE':p.role==='S'?' · SPIN':''}</span><small>${p.fmt}</small></div><strong class="tiny-name">${roleIcon(p.role)}<span class="name-text">${html(p.name)}</span></strong>${statPair(p)}</button><div class="tiny-player-foot">${sourceLink(p)}<button data-action="choose" data-id="${html(p.id)}" class="tiny-add" aria-label="Draft ${html(p.name)}">＋ PICK</button></div></article>`;}
function xiBoard(){return `<section class="xi-zone" aria-label="Your eleven batting-order positions"><div class="zone-heading"><div class="zone-heading-main"><span class="zone-eyebrow">YOUR XI · TAP TO REORDER</span><strong>${state.round}<span> / 11 SELECTED</span></strong></div><div class="xi-steps"><span>ROUND ${String(Math.min(11,state.round+1)).padStart(2,'0')} / 11</span><div class="xi-progress"><i style="width:${state.round/11*100}%"></i></div></div></div><div class="xi-mini-grid">${state.slots.map((p,i)=>`<button class="xi-mini ${p?'xi-filled':''} ${p&&p.id===lastDrafted?'just-drafted':''}" data-action="editSlot" data-slot="${i}" aria-label="${p?html(p.name)+', '+skillName(p.role)+', reorder':'Batting position '+(i+1)+' empty'}" title="Batting #${i+1}${p?' • '+html(p.name)+' • '+skillName(p.role):' • empty'}"><div class="xi-mini-top"><span class="xi-num">${String(i+1).padStart(2,'0')}</span><span class="xi-role">${p?roleIcon(p.role,true)+shortRole(p.role):'—'}</span></div><div class="xi-mini-name">${p?html(p.name):'<span class="xi-empty">+ Empty</span>'}</div></button>`).join('')}<div class="xi-mini-tip" aria-label="Your XI progress"><strong>🏏</strong><small>${state.round===11?'XI READY':`${11-state.round} TO GO`}<br>YOUR ORDER</small></div></div></section>`;}
function compactDraw(){const d=state.draw;return `<div class="compact-draw"><div class="compact-reel"><small>COUNTRY</small><b>${d?NATIONS[d.country]+' '+html(d.country):'???'}</b><button data-action="reroll" data-type="country" ${!d||!state.rerolls.country?'disabled':''}>↻ ${state.rerolls.country} reroll</button></div><div class="compact-reel"><small>DECADE</small><b>${d?d.era+'s':'???'}</b><button data-action="reroll" data-type="era" ${!d||!state.rerolls.era?'disabled':''}>↻ ${state.rerolls.era} reroll</button></div><button data-action="spin" aria-label="${d?'Players drawn':'Spin the cricket ball to draw country and decade'}" class="compact-spin" ${d?'disabled':''}>${cricketBallSVG}<b class="spin-label">${d?'PICK':'SPIN'}</b></button></div>`;}
function draft(){
 let c=state.draw?poolFor(state.draw.country,state.draw.era):[],n=Math.max(1,Math.ceil(c.length/6));state.page=clamp(state.page,0,n-1);
 return `<div class="draft-board">${xiBoard()}<section class="options-zone" aria-label="Randomized era-specific cricket players">${compactDraw()}<div class="options-heading"><div><strong>20-PLAYER ERA POOL</strong><span>${state.draw?html(state.draw.country)+' · '+state.draw.era+'s':'Spin for your next selection'}</span></div><div class="options-count">${state.draw?c.length+' AVAILABLE':11-state.round+' TO DRAFT'}</div></div>${state.draw?`<div class="tiny-grid">${c.slice(state.page*6,state.page*6+6).map(tinyPlayer).join('')}${Array.from({length:Math.max(0,6-c.slice(state.page*6,state.page*6+6).length)},()=>'<div class="tiny-placeholder"><span>🏏</span><small>VIEW OTHER<br>PAGES</small></div>').join('')}</div><div class="tiny-pager"><button data-action="page" data-offset="-1" ${!state.page?'disabled':''}>‹ PREV</button><span>PAGE ${state.page+1} / ${n} · 20 ERA PLAYERS</span><button data-action="page" data-offset="1" ${state.page===n-1?'disabled':''}>NEXT ›</button></div>`:`<div class="waiting-draw"><div class="waiting-logo">${cricketBallSVG}</div><strong>${state.round?'READY FOR ROUND '+(state.round+1)+'?':'BUILD YOUR DREAM XI'}</strong><p>Spin the cricket ball to discover 20 era-specific cricketers. Draft anyone into any batting position.</p><button class="btn main ball-start" data-action="spin">${cricketBallSVG} SPIN FOR LEGENDS</button></div>`}</section></div>`;
}
function squad(){return `<div class="squad-title"><strong>YOUR BATTING ORDER</strong><span class="badge">${state.round}/11 FILLED</span></div><div class="squad-grid">${state.slots.map((p,i)=>`<button class="squad-slot ${p?'filled':''}" data-action="editSlot" data-slot="${i}" title="${p?'Move or swap '+html(p.name):'Batting position '+(i+1)}"><span class="slot-no">${i+1}</span><span class="slot-info"><small>POSITION ${i+1} · ${p?skillName(p.role):'EMPTY'}</small><strong>${p?roleIcon(p.role,true)+' '+html(p.name):'Empty'}</strong></span></button>`).join('')}</div><div class="squad-foot">Tap any player to change their batting position. Choose any mix of bowlers.</div>`;}
function showAssign(p){const ss=state.slots.map((q,i)=>({i,p:q})).filter(x=>!x.p);
 openModal(`<div class="modal-head"><div><div class="sup">ROUND ${state.round+1} · CHOOSE YOUR BATTING ORDER</div><h2>${roleIcon(p.role)} ${html(p.name)}</h2><span class="small">${NATIONS[p.nation]} ${p.nation} · ${skillName(p.role)}${p.role==='P'?' (PACE)':p.role==='S'?' (SPIN)':''} · ${state.draw?.era}s</span></div><button class="icon-btn" data-action="close">✕</button></div><div class="modal-stats">${p.runs!=null?`<span>${fmt(p.runs)} career runs</span>`:''}${p.avg!=null?`<span>${p.avg.toFixed(2)} career batting avg</span>`:''}${p.wk!=null?`<span>${fmt(p.wk)} career wickets</span>`:''}${p.ba!=null?`<span>${p.ba.toFixed(2)} career bowling avg</span>`:''}${p.runs==null&&p.wk==null?'<span>Published career figures are fetched when available; no invented totals.</span>':''}</div><div class="small">Choose any open batting position. You can move players afterwards; bowlers, wicketkeepers and batters have no mandatory slots.</div><div class="choose-grid free-order">${ss.map(x=>`<button class="choose-slot" data-action="assign" data-id="${html(p.id)}" data-slot="${x.i}"><b>#${x.i+1}</b><small>OPEN SPOT</small></button>`).join('')}</div><div class="small">Career statistics: ${sourceLink(p)} · Format: ${p.fmt}</div>`);
}
function currentStreak(){let n=0;for(let i=state.results.length-1;i>=0&&state.results[i].win;i--)n++;return n;}
function animatedDraw(which,btn){
 if(spinBusy||state.screen!=='draft')return;
 spinBusy=true;
 const reel=document.querySelector('.compact-draw');reel?.classList.add('is-spinning');
 btn.disabled=true;
 const waiting=document.querySelector('.waiting-draw');waiting?.classList.add('is-spinning');
 const now=state.round;
 setTimeout(()=>{spinBusy=false;if(state.screen!=='draft'||state.round!==now)return;draw(which);enrichDraw();if(state.draw){showToast('🏏',`${state.draw.country} · ${state.draw.era}s — choose your legend`);fx('reveal');}},560);
}
function showToast(icon,message){document.getElementById('draftToast')?.remove();if(toastTimeout)clearTimeout(toastTimeout);const div=document.createElement('div');div.id='draftToast';div.className='draft-toast';div.setAttribute('role','status');const sym=document.createElement('span');sym.className='mini-trophy';sym.textContent=icon;const msg=document.createElement('span');msg.textContent=message;div.append(sym,msg);document.body.append(div);toastTimeout=setTimeout(()=>div.remove(),2600);}
const GAME_GOALS=[
 {id:'first',icon:'🏏',name:'First selection',about:'Draft your first legend',target:1,progress:()=>Math.min(1,state.round)},
 {id:'xi',icon:'⭐',name:'Dream XI complete',about:'Assemble all 11 batting positions',target:11,progress:()=>Math.min(11,state.round)},
 {id:'pace',icon:'💨',name:'Pace battery',about:'Build an XI with four pace bowlers',target:4,progress:()=>state.slots.filter(p=>p?.role==='P').length},
 {id:'world',icon:'🌍',name:'World XI',about:'Select players from five countries',target:5,progress:()=>new Set(state.slots.filter(Boolean).map(p=>p.nation)).size},
 {id:'streak',icon:'🔥',name:'On a roll',about:'Win three simulated matches in a row',target:3,progress:()=>currentStreak()},
 {id:'ten',icon:'🏆',name:'Ten-win club',about:'Win ten matches in a season',target:10,progress:()=>state.results.filter(r=>r.win).length},
 {id:'perfect',icon:'👑',name:'The 20–0 legend',about:'Complete a perfect 20-match season',target:20,progress:()=>state.results.filter(r=>r.win).length===20?20:state.results.filter(r=>r.win).length}
];
function saveGoals(){try{localStorage.setItem(ACHKEY,JSON.stringify(achievements))}catch{}}
function checkGoals(bulk=false){let fresh=[];for(const g of GAME_GOALS){if(!achievements[g.id]&&g.progress()>=g.target){achievements[g.id]={unlocked:Date.now()};fresh.push(g);}}if(fresh.length){saveGoals();if(!bulk){showToast('🏅',fresh[0].name+' unlocked'+(fresh.length>1?` · +${fresh.length-1} more`:'') );fx('milestone');}}return fresh.length;}
function onDraftPick(p){const achievementsUnlocked=checkGoals();if(state.round===11){showToast('🏆','Your XI is complete! Choose how to begin the season.');fx('milestone');}else if(!achievementsUnlocked && state.round!==1){showToast('🏏',`${p.name} joins your XI · ${state.round}/11 drafted`);}}
function showGoals(){const unlocked=GAME_GOALS.filter(g=>achievements[g.id]).length;
 openModal(`<div class="modal-head"><div><div class="sup">THE LONG GAME · ACHIEVEMENTS</div><h2>🏅 Cricket challenges</h2><span class="small">${unlocked} / ${GAME_GOALS.length} unlocked · Milestones are optional and never affect your chances.</span></div><button class="icon-btn" data-action="close">✕</button></div><div class="goal-grid scrollbox">${GAME_GOALS.map(g=>{const count=Math.min(g.target,g.progress()),done=!!achievements[g.id];return `<div class="goal-card ${done?'complete':''}"><div class="goal-top"><strong>${g.icon} ${g.name}</strong><span class="goal-value">${done?'✓ UNLOCKED':count+' / '+g.target}</span></div><p>${g.about}</p><div class="goal-track"><i style="width:${(done?1:count/g.target)*100}%"></i></div></div>`;}).join('')}</div><button class="btn main full" data-action="close">BACK TO CRICKET</button>`);
}

function ready(){const x=buildPower();return `${appHeader()}<div class="ready-main"><div class="ready-card pane"><div><div class="sup">YOUR XI · MATCHDAY READY</div><div class="ready-rating"><div class="power">${x.power}<span class="small"> / 100</span></div></div><div class="ready-subtitle">Your batting order and chosen bowling attack shape the simulation.</div></div><div>${met('Batting',x.bat)}${met('Bowling',x.bowl)}${met('Depth',x.balance)}</div><div class="ready-actions"><button class="btn main" data-action="season">▶ PLAY</button><button class="btn main" data-action="instantAll">⚡ SIM ALL 20</button><button class="btn alt" data-action="online">🌐 ONLINE</button></div></div><div class="draft-right pane">${squad()}</div></div>`;}

render();
</script></body></html>
