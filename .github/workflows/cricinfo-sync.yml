name: Update ESPNcricinfo player IDs and career statistics
on:
  push:
    paths:
      - ".github/workflows/cricinfo-sync.yml"
      - "cricinfo-connect.js"
      - "test-cricinfo-connect.js"
      - "package.json"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Match identities to Cricsheet ESPNcricinfo registry
        run: node cricinfo-connect.js --identities
      - name: Pull career summaries from Statsguru provider
        if: github.event_name != 'push'
        env:
          APISH_KEY: "${{ secrets.APISH_KEY }}"
          CRICINFO_MAX_CALLS: "20"
        run: |
          if [ -n "$APISH_KEY" ]; then
            node cricinfo-connect.js --stats
          else
            echo "API.SH key missing; identities connected, stats import skipped."
          fi
      - name: Test data and gameplay compatibility
        run: npm test
      - name: Commit player record updates
        run: |
          if ! git diff --quiet -- player-data.json index.html cricinfo-id-map.json; then
            git config user.name "Cricket Legends stats sync"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add player-data.json index.html cricinfo-id-map.json
            git commit -m "Sync ESPNcricinfo identities and sourced records"
            git push
          fi
